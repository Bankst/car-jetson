header:
  version: 14

distro: banks-jetson
machine: jetson-xavier-nx-banks-devkit
target: banks-jetson-image-base

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:
      meta-filesystems:

  meta-tegra:
    url: https://github.com/OE4T/meta-tegra
    branch: scarthgap-l4t-r35.x

  meta-seeed-jetson:
    path: meta-seeed-jetson

local_conf_header:
  tegra-license: |
    LICENSE_FLAGS_ACCEPTED = "commercial"
    ACCEPT_L4T_BINARIES = "1"

  rootfs: |
    IMAGE_FSTYPES = "tegraflash"
    IMAGE_ROOTFS_EXTRA_SPACE = "1048576"

  parallelism: |
    BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"
