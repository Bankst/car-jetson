header:
  version: 14

distro: banks-jetson
machine: jetson-xavier-nx-a203
target: banks-jetson-image-base

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:
    patches:
      icecc-no-null-prefix:
        repo: meta-seeed-jetson
        path: patches/icecc-no-null-prefix.patch

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:
      meta-filesystems:

  meta-tegra:
    url: https://github.com/OE4T/meta-tegra
    branch: scarthgap-l4t-r35.x

  meta-seeed-jetson:
    path: meta-seeed-jetson

local_conf_header:
  tegra-license: |
    LICENSE_FLAGS_ACCEPTED = "commercial"
    ACCEPT_L4T_BINARIES = "1"

  bbmask-frontend: |
    # banks-frontend inherits qt6-cmake which only exists when meta-qt6
    # is included (kiosk.yml / plasma.yml / future aa.yml). Mask it from
    # the DE-agnostic base build so parse succeeds without the Qt layer.
    # Qt-enabled kas variants override BBMASK to unmask it.
    BBMASK = ".*/banks-frontend/.*"

  rootfs: |
    IMAGE_FSTYPES = "tegraflash"
    IMAGE_ROOTFS_EXTRA_SPACE = "1048576"

  parallelism: |
    BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"

  icecc: |
    # Distributed compile via Icecream.
    # Active only when the kas-icecc image is used and the local iceccd
    # Unix socket is bind-mounted in. With stock kas image, INHERIT remains
    # but `icecc` binary is absent from HOSTTOOLS_NONFATAL — bbclass no-ops
    # silently. See docker/README.md.
    INHERIT += "icecc"
    ICECC_PATH ?= "/usr/bin/icecc"
    # Aggregate parallelism: local 16t + remote 32t. Tune as nodes change.
    ICECC_PARALLEL_MAKE ?= "-j 50"
    # Local preprocessing is mandatory: ICECC_REMOTE_CPP=1 was reproduced
    # to silently truncate bench-slope.o (libgcrypt) to 0 bytes — link
    # then failed with "undefined reference to main". Switching to "0"
    # (preprocess locally, ship preprocessed source) made libgcrypt build
    # cleanly. Slightly slower than remote CPP but produces deterministic,
    # complete object files.
    ICECC_REMOTE_CPP ?= "0"
    # Parse-time NULL-prefix crash workaround: target-sdk-provides-dummy
    # overrides PACKAGE_ARCH so icecc_is_allarch returns False, defeating
    # the bbclass's ICECC_RECIPE_DISABLE bail-out during vardep expansion.
    # Force-disable icecc for the recipe so set_icecc_env never reaches
    # icecc_version's HOST_PREFIX check.
    ICECC_DISABLED:pn-target-sdk-provides-dummy = "1"
