BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "seeed-jetson"
BBFILE_PATTERN_seeed-jetson = "^${LAYERDIR}/"
BBFILE_PRIORITY_seeed-jetson = "10"

LAYERSERIES_COMPAT_seeed-jetson = "scarthgap"

LAYERDEPENDS_seeed-jetson = "core tegra networking-layer"

# KDE's master branches list LAYERSERIES_COMPAT as "styhead walnascar" but their
# own scarthgap.xml manifest pairs them with poky scarthgap. The override has
# to live in a layer.conf (parsed before the compat check), not local.conf.
LAYERSERIES_COMPAT_qt6-layer:append = " scarthgap"
LAYERSERIES_COMPAT_kf6:append = " scarthgap"
LAYERSERIES_COMPAT_kde:append = " scarthgap"
