require conf/distro/poky.conf

DISTRO = "banks-jetson"
DISTRO_NAME = "Banks Jetson Linux"
DISTRO_VERSION = "0.1.0-${DATE}"
DISTRO_CODENAME = "scarthgap"
SDK_VENDOR = "-banksjetsonsdk"

MAINTAINER = "banks.troutman@oxos.com"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd wayland opengl pam bluetooth wifi pipewire"
DISTRO_FEATURES:remove = "sysvinit x11"
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " sysvinit"

# NetworkManager owns all interfaces including the USB gadget bridge (l4tbr0/usb0).
# A udev rule override (90-banks-usb-gadget-managed.rules) re-manages gadget
# interfaces that NM's default rules mark unmanaged.
VIRTUAL-RUNTIME_net_manager = "networkmanager"
VIRTUAL-RUNTIME_dns_resolver = "networkmanager"
PACKAGECONFIG:append:pn-networkmanager = " nmtui"
SYSTEMD_AUTO_ENABLE:pn-dnsmasq = "disable"

DISTRO_FEATURES:append = " ldconfig"

PACKAGE_CLASSES = "package_deb"

KERNEL_ARGS:append = " audit=0 loglevel=7"

PREFERRED_VERSION_linux-tegra ?= "5.10%"

# poky scarthgap bumped openssl 3.2.6 -> 3.5.6; 3.5.6 has armv8 asm code-gen
# bug — sha1-armv8.pl emits "eor w13,w13" (missing operand) on line 768.
# Disable asm acceleration until upstream patch lands.
EXTRA_OECONF:append:pn-openssl = " no-asm"
EXTRA_OECONF:append:pn-openssl-native = " no-asm"

INHERIT:remove = "create-spdx"
