#@TYPE: Machine
#@NAME: Jetson Xavier NX Developer Kit (eMMC + NVMe)
#@DESCRIPTION: NVIDIA Xavier NX devkit carrier (P3509) with eMMC module.
#              Rootfs on NVMe, bootloader on QSPI/eMMC. DTB = stock devkit +
#              CS42448 TDM codec overlay (seeed-devkit-devicetree).

require conf/machine/jetson-xavier-nx-devkit-emmc.conf

MACHINEOVERRIDES =. "jetson-xavier-nx-banks-devkit:"

TNSPEC_BOOTDEV = "nvme0n1p1"

# Custom DTB = stock devkit + CS42448 TDM codec overlay (seeed-devkit-devicetree).
# Mirrors the A203 mechanism: recipe provides virtual/dtb, DTBFILE names it,
# meta-tegra bootfiles emit the extlinux FDT line. See docs/jetson-cs42448-tdm-plan.md.
PREFERRED_PROVIDER_virtual/dtb = "seeed-devkit-devicetree"
DTBFILE = "tegra194-p3668-cs42448.dtb"
KERNEL_DEVICETREE = ""

MACHINE_EXTRA_RDEPENDS:append = " banks-jetson-iface banks-audio-route cs42448-channel-map"
MACHINE_FEATURES:append = " can spi"
