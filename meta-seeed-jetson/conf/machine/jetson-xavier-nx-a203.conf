#@TYPE: Machine
#@NAME: Jetson Xavier NX on SeeedStudio A203 V2 carrier
#@DESCRIPTION: Xavier NX production module (eMMC) on Seeed A203 V2 with M.2
#              Key M (NVMe) and M.2 Key E (Wi-Fi). Rootfs lives on the NVMe;
#              bootloader stays on the QSPI/eMMC.

require conf/machine/jetson-xavier-nx-devkit-emmc.conf

MACHINEOVERRIDES =. "jetson-xavier-nx-a203:"

TNSPEC_BOOTDEV = "nvme0n1p1"

PREFERRED_PROVIDER_virtual/dtb = "seeed-a203-devicetree"
DTBFILE = "tegra194-p3668-a203.dtb"
KERNEL_DEVICETREE = ""

MACHINE_EXTRA_RDEPENDS:append = " banks-jetson-iface banks-audio-route"
MACHINE_EXTRA_RRECOMMENDS:remove = "kernel-module-rtk-btusb kernel-module-rtl8822ce tegra-firmware-rtl8822"
MACHINE_FEATURES:append = " can spi"
