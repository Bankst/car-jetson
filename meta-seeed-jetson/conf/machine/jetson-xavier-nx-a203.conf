#@TYPE: Machine
#@NAME: Jetson Xavier NX on SeeedStudio A203 V2 carrier
#@DESCRIPTION: Xavier NX production module (eMMC) on Seeed A203 V2 with M.2
#              Key M (NVMe) and M.2 Key E (Wi-Fi). Rootfs lives on the NVMe;
#              bootloader stays on the QSPI/eMMC. A203-customized device tree
#              and pinmux supplied by the tegra-bsp-a203 recipe.

require conf/machine/jetson-xavier-nx-devkit-emmc.conf

MACHINEOVERRIDES =. "jetson-xavier-nx-a203:"

# Boot from QSPI/eMMC, rootfs on the M.2 NVMe SSD.
TNSPEC_BOOTDEV = "nvme0n1p1"

# Use NVIDIA's prebuilt UEFI binary (from L4T R35.6.4 BSP) instead of
# source-building EDK2. Avoids the GenFw/PE-COFF toolchain mismatch
# in source builds on scarthgap GCC 13. The prebuilt is what NVIDIA
# officially ships and is well-validated for Xavier NX.
PREFERRED_PROVIDER_virtual/bootloader = "tegra-uefi-prebuilt"

# Built by tegra-bsp-a203 alongside whatever the kernel produces; the bbappend
# on linux-tegra overlays our DTBs into the deploy dir at flash time.
KERNEL_DEVICETREE = "tegra194-p3668-all-p3509-0000.dtb"

# Pull in the small set of A203-specific package additions.
MACHINE_EXTRA_RDEPENDS:append = " seeed-a203-iface"
MACHINE_FEATURES:append = " can spi"
