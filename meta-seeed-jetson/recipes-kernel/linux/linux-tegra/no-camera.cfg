# Disable Tegra camera RTCPU + V4L2/VI chain.
#
# Boot-time cost: with these enabled, the kernel pauses ~20s waiting for the
# t194-rce-safe camera firmware to load over IVC. No cameras are connected on
# this build (A203 V2 / devkit headless), so the entire RTCPU/VI chain is
# dead weight.
#
# We intentionally keep TEGRA_GRHOST=y — display (TEGRA_DC), NVDEC, NVENC,
# NVJPG, VIC, GPU all hang off it.

# --- core camera RTCPU + IVC consumers ---
# CONFIG_TEGRA_CAMERA_RTCPU is not set
# CONFIG_TEGRA_CAMERA_HSP_MBOX_CLIENT is not set
# CONFIG_I2C_TEGRA_CAMRTC is not set

# --- VI / host1x camera capture ---
# CONFIG_VIDEO_TEGRA_VI is not set
# CONFIG_VIDEO_TEGRA_VI_TPG is not set
# CONFIG_TEGRA_CAMERA_PLATFORM is not set
# CONFIG_TEGRA_GRHOST_NVCSI is not set
# CONFIG_TEGRA_GRHOST_SLVSEC is not set
# CONFIG_TEGRA_GRHOST_ISP is not set

# --- camera_common / tegracam framework ---
# CONFIG_VIDEO_CAMERA is not set
# CONFIG_VIDEO_CAMERA_SKT is not set

# --- NVIDIA camera I2C sensor / serdes drivers ---
# All reference tegracam_* / sensor_common_* / regmap_util_* symbols that
# live under VIDEO_CAMERA. NV_VIDEO_IMX390, I2C_IOEXPANDER_SER_MAX9295,
# I2C_IOEXPANDER_DESER_MAX9296 are =y in tegra_defconfig and break the
# vmlinux link without these disables. The =m ones are also dropped to
# keep modules.dep clean and avoid building dead code.
# CONFIG_NV_VIDEO_IMX185 is not set
# CONFIG_NV_VIDEO_IMX219 is not set
# CONFIG_NV_VIDEO_IMX268 is not set
# CONFIG_NV_VIDEO_IMX274 is not set
# CONFIG_NV_VIDEO_IMX318 is not set
# CONFIG_NV_VIDEO_IMX390 is not set
# CONFIG_NV_VIDEO_IMX477 is not set
# CONFIG_NV_VIDEO_LC898212 is not set
# CONFIG_NV_VIDEO_OV5693 is not set
# CONFIG_NV_VIDEO_OV9281 is not set
# CONFIG_NV_VIDEO_OV10823 is not set
# CONFIG_NV_VIDEO_OV23850 is not set
# CONFIG_NV_VIDEO_AR0234 is not set
# CONFIG_NV_VIDEO_HAWK_OWL is not set
# CONFIG_NV_DESER_MAX96712 is not set
# CONFIG_NV_VIRTUAL_I2C_MUX is not set
# CONFIG_VIDEO_TC358840 is not set
# CONFIG_VIDEO_LT6911UXC is not set
# CONFIG_VIDEO_ECAM is not set
# CONFIG_I2C_IOEXPANDER_SER_MAX9295 is not set
# CONFIG_I2C_IOEXPANDER_DESER_MAX9296 is not set

# CDI / ISC camera management — cam_cdi_tsc.ko references symbols (e.g.
# Hawk_Owl_Fsync_program) from disabled sensor drivers.
# CONFIG_VIDEO_CDI is not set
# CONFIG_VIDEO_ISC is not set
