# Tegra SoC audio re-enable (devkit only).
#
# Stock p3668 audio DTSI (nvidia/platform/t19x/jakku/.../tegra194-audio-p3668.dtsi)
# already enables I2S5 with I2S_DUMMY codec on the I2S_DAP cell, so the 40-pin
# header (DAP5: pin 12 BCLK, 35 LRCLK, 40 SDATA) is wired by default. All we
# need is the kernel drivers built so ALSA exposes the I2S5 BE.
#
# PCM5102A is a pin-strap configured DAC (no I2C/SPI control bus), so no codec
# DT node is required.

# Tegra ASoC core + machine driver
CONFIG_SND_SOC_TEGRA=m
CONFIG_SND_SOC_TEGRA_MACHINE_DRIVER=m
CONFIG_SND_SOC_TEGRA_UTILS=m
CONFIG_SND_SOC_TEGRA210_AUDIO=m

# Tegra audio crossbar fabric + DMA
CONFIG_SND_SOC_TEGRA210_AHUB=m
CONFIG_SND_SOC_TEGRA210_ADMAIF=m
CONFIG_TEGRA210_ADMA=m

# I2S DAI (needed for I2S5 -> PCM5102A)
CONFIG_SND_SOC_TEGRA210_I2S=m

# ADSP (loads adsp.elf; needed by tegra186-ape machine driver)
CONFIG_TEGRA_NVADSP=m
CONFIG_SND_SOC_TEGRA210_ADSP=m

# Optional HW accelerators in the AHUB fabric (small modules, keep on for
# parity with NVIDIA reference image so userspace tools that probe controls
# don't fail)
CONFIG_SND_SOC_TEGRA210_AMX=m
CONFIG_SND_SOC_TEGRA210_ADX=m
CONFIG_SND_SOC_TEGRA210_SFC=m
CONFIG_SND_SOC_TEGRA210_MVC=m
CONFIG_SND_SOC_TEGRA210_MIXER=m
CONFIG_SND_SOC_TEGRA210_AFC=m
CONFIG_SND_SOC_TEGRA210_OPE=m
CONFIG_SND_SOC_TEGRA186_ASRC=m
CONFIG_SND_SOC_TEGRA186_ARAD=m

# Generic S/PDIF transmitter dummy codec (linux,spdif-dit). Not strictly
# needed for PCM5102A on stock devkit DTB (it uses I2S_DUMMY internal),
# but enabling lets future overlays use simple-audio-card + spdif-dit if
# we ever need a non-stock topology.
CONFIG_SND_SOC_SPDIF=m
