# Tegra SoC audio enable for the CS42448 TDM codec (A203 + devkit).
#
# Stock p3668 audio DTSI (nvidia/platform/t19x/jakku/.../tegra194-audio-p3668.dtsi)
# brings up the nvidia,tegra186-ape card on I2S5/DAP5 (40-pin header: pin 12
# BCLK, 35 LRCK, 40 DOUT, 38 DIN; aud_mclk pin 7). cs42448.dtsi swaps the stock
# I2S_DUMMY codec on i2s5_to_codec for the cs42xx8 codec. Card mclk-fs=256 ->
# aud_mclk = 256*Fs (12.288 MHz @ 48k). These knobs build the SoC audio drivers
# so ALSA exposes the I2S5 BE + AHUB fabric; cs42448.cfg adds the codec driver.

# Tegra ASoC core + machine driver
CONFIG_SND_SOC_TEGRA=m
CONFIG_SND_SOC_TEGRA_MACHINE_DRIVER=m
CONFIG_SND_SOC_TEGRA_UTILS=m
CONFIG_SND_SOC_TEGRA210_AUDIO=m

# Tegra audio crossbar fabric + DMA
CONFIG_SND_SOC_TEGRA210_AHUB=m
CONFIG_SND_SOC_TEGRA210_ADMAIF=m
CONFIG_TEGRA210_ADMA=m

# I2S DAI (needed for I2S5 -> PCM5102A)
CONFIG_SND_SOC_TEGRA210_I2S=m

# ADSP — DELIBERATELY DISABLED. On this image the ADSP is useless: the OS runs
# in secure-load mode (nvidia,adsp_os_secload=1), so only the WIRE passthrough
# app loads; the 5 real plugins (mp3-dec/aac-dec/src/spkprot/aec) are not bundled
# in our signed adsp-fw.bin and dynamic ELF load from rootfs is blocked under
# secload (nvadsp/app.c:319). No way to add plugins without the OEM signing key.
# The tegra186-ape card does NOT require ADSP: disabling tegra_adsp_audio in DT
# (see cs42448.dtsi) makes the card auto-skip the ADSP dai-links via
# of_dai_link_is_available(), so the codec still probes. Disabling reclaims the
# ADSP DRAM carveout + nvadsp.ko/snd-soc-tegra210-adsp.ko and removes the
# tegra210-adsp "Broken Path - FE not linked to BE" boot spam + 5x "Failed to
# init app" errors + PipeWire "Broken pipe" churn. Real DSP = AHUB OPE/MVC/SFC.
# Nothing select's these, so the unsets hold. See docs/audio-board/cs42448-driver-notes.md.
# CONFIG_TEGRA_NVADSP is not set
# CONFIG_SND_SOC_TEGRA210_ADSP is not set

# Optional HW accelerators in the AHUB fabric (small modules, keep on for
# parity with NVIDIA reference image so userspace tools that probe controls
# don't fail)
CONFIG_SND_SOC_TEGRA210_AMX=m
CONFIG_SND_SOC_TEGRA210_ADX=m
CONFIG_SND_SOC_TEGRA210_SFC=m
CONFIG_SND_SOC_TEGRA210_MVC=m
CONFIG_SND_SOC_TEGRA210_MIXER=m
CONFIG_SND_SOC_TEGRA210_AFC=m
CONFIG_SND_SOC_TEGRA210_OPE=m
CONFIG_SND_SOC_TEGRA186_ASRC=m
CONFIG_SND_SOC_TEGRA186_ARAD=m

# Generic S/PDIF transmitter dummy codec (linux,spdif-dit). Not strictly
# needed for PCM5102A on stock devkit DTB (it uses I2S_DUMMY internal),
# but enabling lets future overlays use simple-audio-card + spdif-dit if
# we ever need a non-stock topology.
CONFIG_SND_SOC_SPDIF=m
