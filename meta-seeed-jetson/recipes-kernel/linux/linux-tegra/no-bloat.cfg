# Trim PC-class drivers that have ZERO chance of being relevant on Xavier NX
# (Tegra T194 on A203 V2 or P3509 devkit). Every probe = boot noise + ROM bulk.
#
# Hardware we ACTUALLY support:
#   net: r8168 PCIe (A203), Tegra nvethernet, USB r8152, CDC NCM/ECM/RNDIS gadget
#   sound: HDMI (SND_HDA_TEGRA), USB headset (SND_USB_AUDIO), future I2S (SOC_TEGRA)
#   input: USB HID via NanoKVM
#   storage: NVMe, eMMC, microSD
#
# KEEP (don't be tempted): SND_HDA_TEGRA + SND_HDA_CODEC_HDMI (HDMI audio path),
# SND_USB_AUDIO, R8168, USB_RTL8152, NVETHERNET, all RTL*-Wi-Fi, ACPI, USB host.

# =============================================================================
# Server / PC PCI Ethernet — none of these chipsets are wired on Xavier NX.
# Many are =y in tegra_defconfig (Tegra defconfig was forked from a generic
# distro tree). Disabling reclaims rodata + kills probe spam.
# =============================================================================

