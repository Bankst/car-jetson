# CONFIG_ATMEL is not set

# =============================================================================
# Netfilter app-layer connection-tracking helpers. None of these protocols
# (FTP, IRC, SIP, TFTP, H.323, PPTP) are used at boot or in runtime. NM's
# `method=shared` bridge needs only base NAT + MASQUERADE, which stay.
# Each helper module loaded at boot adds udev-coldplug time + RAM. Critical
# early-boot net path = SSH; nothing else.
# =============================================================================
# CONFIG_NF_CONNTRACK_FTP is not set
# CONFIG_NF_CONNTRACK_IRC is not set
# CONFIG_NF_CONNTRACK_SIP is not set
# CONFIG_NF_CONNTRACK_TFTP is not set
# CONFIG_NF_CONNTRACK_H323 is not set
# CONFIG_NF_CONNTRACK_PPTP is not set
# CONFIG_NF_NAT_FTP is not set
# CONFIG_NF_NAT_IRC is not set
# CONFIG_NF_NAT_SIP is not set
# CONFIG_NF_NAT_TFTP is not set
# CONFIG_NF_NAT_H323 is not set
# CONFIG_NF_NAT_PPTP is not set

# =============================================================================
# BNEP / WWAN modules: keep compiled (=m) but blacklisted at boot via
# `meta-seeed-jetson/recipes-bsp/banks-jetson-iface/files/banks-blacklist.conf`
# → `/etc/modprobe.d/`. Lazy-load when actually needed (modprobe bnep, or
# udev MODALIAS match on a Quectel modem hotplug). BNEP currently loads at
# boot because BlueZ's profile loader pre-pulls it — blacklist breaks that
# chain without losing the option.
#
# Trim non-QCA HCI UART vendor drivers — the Wi-Fi/BT combo on this board is
# Qualcomm Atheros (QCA6174). Other HCI UART vendor protocols just bloat.
# =============================================================================
# CONFIG_BT_HCIUART_ATH3K is not set
# CONFIG_BT_HCIUART_BCM is not set
# CONFIG_BT_HCIUART_BCSP is not set
# CONFIG_BT_HCIUART_INTEL is not set
# CONFIG_BT_HCIUART_LL is not set

# =============================================================================
# Generic ALSA SoC SPDIF — not used. Onboard SPDIF will never be wired on
# this carrier. (Tegra-specific SOC SPDIF already disabled via no-audio-soc.)
# =============================================================================
# CONFIG_SND_SOC_SPDIF is not set

