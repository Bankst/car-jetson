# Disable Tegra SoC audio (ADSP + I2S + ALSA SoC framework on Tegra210/T194).
#
# A203 V2 carrier and the P3509 devkit do NOT wire any I2S codecs on this
# project. HDMI audio (snd_hda_tegra) and USB audio (snd_usb_audio) remain
# enabled via no-bloat.cfg keepers — those use separate kernel paths and
# are unaffected by these knobs.
#
# Why disable:
#   - tegra210-adsp probes spit "Broken Path1/Path2 - FE not linked to BE"
#     errors 14+ times during userspace boot (each ~30ms). PipeWire's ALSA
#     monitor walks the dummy DAIs and fails with "Broken pipe" repeatedly.
#     Net ~1.5-3s of boot noise + log spam.
#   - nvadsp.ko firmware load (adsp.elf via tegra210_adsp_audio) blocks
#     audio driver bringup for hundreds of ms.
#   - Frees ~1.2MB rodata from the .ko stack (snd_soc_tegra210_*).
#
# If you ever wire an I2S DAC, revert this fragment.

# CONFIG_SND_SOC_TEGRA is not set
# CONFIG_SND_SOC_TEGRA210_ADSP is not set
# CONFIG_SND_SOC_TEGRA210_ADMAIF is not set
# CONFIG_SND_SOC_TEGRA210_AHUB is not set
# CONFIG_SND_SOC_TEGRA210_I2S is not set
# CONFIG_SND_SOC_TEGRA210_DMIC is not set
# CONFIG_SND_SOC_TEGRA210_AMX is not set
# CONFIG_SND_SOC_TEGRA210_ADX is not set
# CONFIG_SND_SOC_TEGRA210_SFC is not set
# CONFIG_SND_SOC_TEGRA210_MVC is not set
# CONFIG_SND_SOC_TEGRA210_MIXER is not set
# CONFIG_SND_SOC_TEGRA210_AFC is not set
# CONFIG_SND_SOC_TEGRA210_IQC is not set
# CONFIG_SND_SOC_TEGRA210_OPE is not set
# CONFIG_SND_SOC_TEGRA_MACHINE_DRIVER is not set
# CONFIG_SND_SOC_TEGRA_UTILS is not set
# CONFIG_TEGRA210_ADMA is not set
# CONFIG_TEGRA_NVADSP is not set
