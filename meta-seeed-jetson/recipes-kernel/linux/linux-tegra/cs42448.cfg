# CS42448 TDM codec (devkit only).
#
# Cirrus Logic CS42448: 8 DAC out / 6 ADC in, TDM on I2S5 (DAP5, 40-pin
# header), I2C control. Driver is the cs42xx8 family (Freescale/mainline):
#   - cs42xx8.c       regmap-agnostic core
#   - cs42xx8-i2c.c   I2C regmap glue (our control bus; CS pin strapped GND)
# compatible "cirrus,cs42448"; TDM via SND_SOC_DAIFMT_DSP_A; codec slave
# (Tegra I2S5 master). See docs/jetson-cs42448-tdm-plan.md.
CONFIG_SND_SOC_CS42XX8=m
CONFIG_SND_SOC_CS42XX8_I2C=m
