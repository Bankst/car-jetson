# USB device-mode gadget — runtime ships NCM (CDC ethernet) + ACM (CDC serial).
# MASS_STORAGE kept because initrd-flash's /init exports rootfs partitions to
# the host via a configfs mass_storage function during the flash sequence.
# Runtime banks-usb-gadget.sh does not instantiate mass_storage, so cable
# jiggle does not trigger f_mass_storage re-probe on the running system.
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_CONFIGFS_MASS_STORAGE=y
# CONFIG_USB_CONFIGFS_RNDIS is not set
# CONFIG_USB_CONFIGFS_ECM is not set
# CONFIG_USB_CONFIGFS_ECM_SUBSET is not set
# CONFIG_USB_CONFIGFS_EEM is not set
