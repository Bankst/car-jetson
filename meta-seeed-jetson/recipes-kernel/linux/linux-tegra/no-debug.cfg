# no-debug.cfg — minimal boot trims, dev-friendly.
#
# This is a continuous-development target — perf, ftrace, bpftrace, kgdb,
# SysRq, lockdep-on-demand all stay available. Only items that have zero
# dev value or are pure boot-time waste are stripped here.
#
# Intentionally KEPT (do not add disables for these):
#   FTRACE / FUNCTION_TRACER / FUNCTION_GRAPH_TRACER / STACK_TRACER /
#   GENERIC_TRACER / EVENT_TRACING / TRACING / TRACEPOINTS   — perf ftrace,
#       trace-cmd, latency tracers, stack-depth sampling.
#   SCHEDSTATS / SCHED_DEBUG / SCHED_INFO                    — perf sched,
#       /proc/sched_debug, runqueue tuning.
#   LOCKUP_DETECTOR / SOFTLOCKUP_DETECTOR / DETECT_HUNG_TASK /
#   WQ_WATCHDOG                                              — kernel-hang
#       backtraces to dmesg when board wedges.
#   FRAME_POINTER                                            — perf -g
#       kernel callgraph unwinding (arm64 5.10 has no ORC).
#   STACKTRACE / LOCK_DEBUGGING_SUPPORT / HAVE_DEBUG_BUGVERBOSE
#                                                            — oops quality,
#       lockdep prereq.
#   MAGIC_SYSRQ / MAGIC_SYSRQ_SERIAL                         — Alt-SysRq
#       over serial when system wedges.
#   DEBUG_INFO / DEBUG_KERNEL / DEBUG_FS                     — perf annotate,
#       BPF CO-RE, NVIDIA debugfs nodes; DEBUG_INFO stripped from deployed
#       Image by OE anyway.
#   KALLSYMS_ALL                                             — perf/bpftrace
#       resolution of non-exported symbols, kprobe-by-name.
#   HAVE_ARCH_KGDB                                           — compile-time
#       capability for later KGDB-over-serial; zero runtime cost.

# Skip crypto algorithm self-tests at boot. Saves 20-60 ms; no functional
# loss (tests run once per alg registration and are noise on a production
# kernel where the algs are vetted upstream).
CONFIG_CRYPTO_MANAGER_DISABLE_TESTS=y

# RCU internal tracepoints — surfaced only via rcutorture / RCU-specific
# debugfs nodes, not via perf list. No dev value here; saves init walk
# of RCU tracepoint table.
# CONFIG_RCU_TRACE is not set

# NVIDIA downstream clk freq-stats debugfs (drivers/clk/clk.c). The code uses
# seq_file functions without including <linux/seq_file.h>; only safe to keep
# when TRACING=y (we do keep it). Left as upstream default; remove this
# comment if upstream fixes the include chain.

# Force xhci-hcd + xhci-tegra builtin. tegra_defconfig ships them =y; some
# fragment merge demotes USB_XHCI_HCD to =m and xhci-tegra.ko then fails
# modpost on non-exported xhci_irq / xhci_hub_control / xhci_urb_enqueue.
# Pin them along with parent CONFIG_USB. Defensive — verify modpost passes.
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_TEGRA=y
