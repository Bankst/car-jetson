# feature-adds.cfg — kernel features ported from mc2 reference defconfig.
#
# These are capability ADDs (not bloat trims). Each is gated on real hardware
# or runtime need on this target.

# --- Framebuffer console deferred takeover ---
# Defers fbcon's grab of /dev/fb0 until first kernel message would print to
# it. Combined with `quiet` cmdline, this eliminates the brief Tux + dmesg
# scroll flash on tty1 before weston (kiosk) takes the framebuffer.
# Boot-splash-friendly. Zero functional downside.
CONFIG_FRAMEBUFFER_CONSOLE_DEFERRED_TAKEOVER=y

# --- nftables firewall ---
# Modern replacement for iptables. Module so it's only resident when
# nft-using userspace (firewalld, nftables CLI, podman/docker) loads it.
# DSCP match/target lets QoS rules tag traffic by Diffserv code point —
# useful for VoIP/media prioritization once we run anything network-shaped.
CONFIG_NF_TABLES=m
CONFIG_NETFILTER_XT_MATCH_DSCP=m
CONFIG_NETFILTER_XT_TARGET_DSCP=m

# --- Promote =m to =y (builtin) for early-boot critical subsystems ---
# HW_RANDOM:    seed kernel CRNG before initramfs userspace runs, instead of
#               waiting on udev to modprobe tegra-se-hwrng. Faster /dev/random
#               readiness, no early-boot getrandom() stalls.
# OVERLAY_FS:   used by kiosk + rootfs overlay layering. Builtin removes the
#               initrd modprobe step before pivot_root.
# USB_NET_CDC_NCM: NCM driver for the USB gadget bridge. Builtin so usb0
#               appears the moment gadget enumerates, no module-load race
#               with NetworkManager's l4tbr0 bridge bring-up.
CONFIG_HW_RANDOM=y
CONFIG_OVERLAY_FS=y
CONFIG_USB_NET_CDC_NCM=y

# --- xhci-tegra modpost fix ---
# tegra_defconfig ships USB_XHCI_HCD=y + USB_XHCI_TEGRA=y. Some fragment merge
# (likely no-bloat.cfg side effect via dependency reshuffle) demotes USB_XHCI_HCD
# to =m, leaving xhci-tegra.ko referencing non-exported xhci_irq, xhci_hub_control,
# xhci_urb_enqueue, etc. Pin both back to =y to satisfy modpost.
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_TEGRA=y
