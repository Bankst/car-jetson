# Prevent boot-time auto-load of modules we keep available but rarely need.
# Each remains a loadable module — `modprobe <name>` works on demand. On
# hotplug, udev MODALIAS matches still load USB serial / CDC drivers when a
# real device appears.
#
# BNEP: BT-PAN tethering. BlueZ's profile init pulls it in eagerly otherwise.
#       Our use case is A2DP + AVRCP only.
# usbserial + option: cellular AT-command serial. Deferred Quectel work.
# cdc_wdm: USB Wireless Device Management (paired with MBIM/QMI for modems).
# cdc_mbim: Mobile Broadband Interface Model — cellular IP gateway. Deferred.
#
# To enable on the fly: `modprobe bnep` (or any other), then re-blacklist by
# removing the matching line and rebooting.

blacklist bnep
blacklist option
blacklist cdc_wdm
blacklist cdc_mbim
