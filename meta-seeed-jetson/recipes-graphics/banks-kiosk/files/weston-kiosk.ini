[core]
idle-time=0
require-input=false

[output]
name=HDMI-A-1
transform=rotate-90

# Remote monitoring: clone the live kiosk output to an RDP server on demand.
# start-on-startup=false -> nothing listens at boot; the nested RDP weston is
# spawned only when the screen-share keybinding (Ctrl+Alt+S) fires. Trigger it
# from the CLI with `kiosk-rdp on` (injects the combo via ydotool); stop with
# `kiosk-rdp off`. TLS cert/key are generated by kiosk-rdp if missing.
[screen-share]
command=/usr/bin/weston --backend=rdp-backend.so --shell=fullscreen-shell.so --no-clients-resize --rdp-tls-cert=/etc/kiosk/rdp/tls.crt --rdp-tls-key=/etc/kiosk/rdp/tls.key
start-on-startup=false
