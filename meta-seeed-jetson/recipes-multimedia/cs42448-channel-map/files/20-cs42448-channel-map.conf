# 20-cs42448-channel-map.conf — CS42448 8ch TDM L/R-swap remap
#
# !!! HARDWARE-GATED / UNVERIFIED ON CURRENT ARCH !!!
# This file is from the 2026-06-10 bring-up snapshot, when audio went out a
# direct ALSA sink at hw:1,0. The current route (banks-audio-route.sh) drives
# the codec through the AHUB: PipeWire(ALSA) -> ADMAIF1 -> MVC1 -> OPE1 -> I2S5.
# The sink card/path below (hw:1,0) is therefore probably WRONG for the live
# path — confirm with `aplay -l` / `pw-cli ls Node` on the board and point
# api.alsa.path at the correct ADMAIF capture/playback device before relying
# on this. Do NOT add this recipe to any image until A/B-verified: a duplicate
# sink can shadow the working route and break clean-boot audio.
#
# WHY it exists: codec board wires AOUT1 -> Jack R, AOUT2 -> Jack L (and so on
# per pair), so the 8ch stream needs its positions swapped per pair to match
# physical channels. audio.position below encodes that swap.

context.objects = [
    {
        factory = adapter
        args = {
            factory.name = api.alsa.pcm.sink
            node.name = "cs42448-sink"
            node.description = "CS42448 8ch TDM"
            media.class = "Audio/Sink"
            api.alsa.path = "hw:1,0"
            audio.format = "S32LE"
            audio.rate = 48000
            audio.channels = 8
            audio.position = [ FR FL RC LFE SR SL BR BL ]
            api.alsa.disable-batch = true
        }
    }
]
