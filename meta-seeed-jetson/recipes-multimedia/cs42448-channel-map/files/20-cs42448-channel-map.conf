# CS42448 TDM board wiring: AOUT1=Jack R, AOUT2=Jack L per pair.
# TDM slots 0,2,4,6 = Right; slots 1,3,5,7 = Left.
# Remap so FL content goes to slot 1 (Jack L) and FR to slot 0 (Jack R).
context.objects = [
    {
        factory = adapter
        args = {
            factory.name = api.alsa.pcm.sink
            node.name = "cs42448-sink"
            node.description = "CS42448 8ch TDM"
            media.class = "Audio/Sink"
            api.alsa.path = "hw:1,0"
            audio.format = "S32LE"
            audio.rate = 48000
            audio.channels = 8
            audio.position = [ FR FL RC LFE SR SL BR BL ]
            api.alsa.disable-batch = true
        }
    }
]
