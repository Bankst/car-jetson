# /etc/banks-audio/route.conf — overrides for banks-audio-route
#
# All values optional. Defaults shown.

# BANKS_AUDIO_CARD=APE
# BANKS_AUDIO_SINK_I2S=I2S5
# BANKS_AUDIO_SOURCE_ADMAIF=ADMAIF1
# BANKS_AUDIO_PEQ_STAGES=11        # N-1 encoded: 11 -> 12 active biquads (silicon max)
# BANKS_AUDIO_PEQ_ACTIVE=off       # Stay off until coefficients are uploaded
# BANKS_AUDIO_MBDRC_MODE=bypass    # bypass | fullband | dualband | multiband
# BANKS_AUDIO_I2S5_RATE=48000
# BANKS_AUDIO_I2S5_CHANNELS=8      # CS42448 TDM: 8 slots on one data line
# BANKS_AUDIO_I2S5_BITS=32         # 32-bit slots -> 256 BCLK/frame for 8ch
# BANKS_AUDIO_I2S5_BCLK_RATIO=1    # MUST be 1 for S32 (slot width = sample*ratio).
                                   #   A stale 256 here is the 1/4-sample-rate bug
                                   #   (frame clamps to 2048 BCLK -> LRCK 12 kHz).
# BANKS_AUDIO_MASTER_VOL=11500     # MVC1 linear curve: int = dB*100 + 12000
                                   #   12000 = 0 dB unity, 11500 = -5 dB headroom
                                   #   range 0..16000 (-120 .. +40 dB)
