# Fallback null sink so WirePlumber can always link audio streams
context.objects = [
  {
    factory = spa-node-factory
    args = {
      factory.name    = support.null-audio-sink
      node.name       = null-audio-sink
      node.description = Null Audio Sink
      media.class     = Audio/Sink
      audio.position  = [ FL FR ]
    }
  }
]
