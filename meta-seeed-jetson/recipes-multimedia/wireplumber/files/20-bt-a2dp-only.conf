# Restrict BT connections to A2DP sink only — suppress HFP/HSP loopback mic cycling
monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        bluez5.profiles          = [ a2dp-sink ]
        bluez5.auto-connect      = [ a2dp-sink ]
      }
    }
  }
]

# Disable autoswitch to headset profile (prevents HFP cycling)
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
